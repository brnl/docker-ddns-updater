name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: |
          helm lint charts/ddns-updater \
            --set hostnames[0]=home.example.com \
            --set credentials.username=user --set credentials.password=pass
      - name: helm template (all features)
        run: |
          helm template test charts/ddns-updater \
            --set hostnames[0]=home.example.com \
            --set credentials.existingSecret=ddns \
            --set ipv6.enabled=true \
            --set networkPolicy.enabled=true \
            --set ingress.enabled=true > /dev/null

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ddns-updater:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm ddns-updater:ci version
          # Missing configuration must fail fast.
          ! docker run --rm ddns-updater:ci
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ddns-updater:ci
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
