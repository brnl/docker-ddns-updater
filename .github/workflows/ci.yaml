name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Chart version
        run: |
          version=$(./hack/chart-version.sh)
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null; then
            echo "::notice title=No release::v${version} already exists; bump the version in Chart.yaml to release this change."
          else
            echo "::notice title=Release::Merging to main releases v${version}."
          fi
      - name: helm lint
        run: |
          for f in charts/ddns-updater/ci/*-values.yaml; do
            helm lint --strict charts/ddns-updater -f "$f"
          done
      - name: Schema rejects unknown keys
        run: |
          if helm template test charts/ddns-updater -f charts/ddns-updater/ci/default-values.yaml \
               --set dnsserver=1.1.1.1 >/dev/null 2>&1; then
            echo "::error::values.schema.json accepted an unknown key"
            exit 1
          fi
      - name: kubeconform
        run: |
          for f in charts/ddns-updater/ci/*-values.yaml; do
            helm template test charts/ddns-updater -f "$f"
          done | go run github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0 \
            -strict -summary -kubernetes-version 1.34.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ddns-updater:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm ddns-updater:ci version
          # Missing configuration must fail fast.
          ! docker run --rm ddns-updater:ci
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ddns-updater:ci
          version: v0.75.0
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
