# -- DDNS provider. Supported: mijnhost
provider: mijnhost

# -- Hostnames (FQDNs) to keep up to date. Required.
hostnames: []
#  - home.example.com

# DynDNS credentials. Use either username/password (a Secret is created) or
# existingSecret (recommended). They are mounted as files, not env variables.
credentials:
  username: ""
  password: ""
  # -- Name of an existing Secret holding the credentials.
  existingSecret: ""
  usernameKey: username
  passwordKey: password

# Let External Secrets Operator (https://external-secrets.io) create the
# credentials Secret from your secret backend. Mutually exclusive with
# credentials.existingSecret; the Secret keys follow credentials.*Key.
externalSecret:
  enabled: false
  apiVersion: external-secrets.io/v1
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore # or SecretStore
    name: ""
  # Remote references; "property" and "version" are optional.
  username:
    key: ""
    property: ""
  password:
    key: ""
    property: ""
  annotations: {}

ipv4:
  enabled: true
  # -- Plain-text IP sources; empty uses the built-in defaults
  # (https://api.ipify.org, https://ifconfig.me/ip).
  sources: []

ipv6:
  enabled: false
  # -- Plain-text IP sources; empty uses the built-in defaults
  # (https://api6.ipify.org, https://ifconfig.me/ip).
  sources: []

# -- How often to check the public IP address. Every check queries each IP
# source once per enabled family (~1440 requests/day per source at 60s). These
# are free services; with a record TTL of 60s, 30s-1m is plenty.
interval: 60s
# -- Timeout for each HTTP request.
timeout: 10s
# -- How often to compare the published DNS records with the detected IP
# ("0" = only at startup).
dnsRecheckInterval: 5m
# -- DNS server for record lookups: an IP address or hostname with an optional
# port, e.g. "1.1.1.1", "dns.quad9.net" or "[2606:4700:4700::1111]:53".
# Empty uses the cluster DNS. Set this with split-horizon DNS (the cluster
# resolves your hostnames to internal addresses): non-public answers are
# ignored, so the public record can then only be verified via this server.
dnsServer: ""
# -- Log what would be updated without calling the provider.
dryRun: false

log:
  level: info # debug, info, warn, error
  format: json # json, text

# -- Serve the status page on "/" (health endpoints are always served).
statusPage:
  enabled: true

metrics:
  # -- Serve Prometheus metrics on /metrics.
  enabled: true
  serviceMonitor:
    # -- Create a Prometheus Operator ServiceMonitor (requires service.enabled).
    enabled: false
    interval: 1m
    scrapeTimeout: 10s
    # -- Extra labels, e.g. `release: kube-prometheus-stack` when your
    # Prometheus only selects ServiceMonitors carrying that label.
    labels: {}
    annotations: {}
    relabelings: []
    metricRelabelings: []
  prometheusRule:
    # -- Create a Prometheus Operator PrometheusRule with alerts.
    enabled: false
    labels: {}
    annotations: {}
    defaultRules:
      # -- Include the built-in alerts (down, out of sync, IP detection
      # failing, split-horizon DNS).
      enabled: true
      # -- How long a hostname may be out of sync before alerting.
      outOfSyncFor: 30m
      # -- How long IP detection may fail before alerting.
      detectionFailingFor: 15m
      severity: warning
    # -- Additional rules appended to the rule group.
    additionalRules: []

# -- Additional environment variables for the container.
extraEnv: []

# -- Extra Kubernetes manifests to deploy with the release. Each item is an
# object or a YAML string, rendered with tpl so it may use template
# expressions such as {{ include "ddns-updater.fullname" . }}.
extraObjects: []

image:
  repository: ghcr.io/brnl/docker-ddns-updater
  # -- Defaults to the chart appVersion.
  tag: ""
  # -- Pin the image by digest (takes precedence over tag), e.g. "sha256:...".
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Use the node's network namespace. Useful for IPv6 when pods have no
# global IPv6 egress, or when pod egress is NATed differently than the node.
hostNetwork: false
# -- HTTP port for the status page and health endpoints.
containerPort: 8080

service:
  enabled: true
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: ddns.example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Gateway API HTTPRoute for the status page (requires service.enabled).
httpRoute:
  enabled: false
  annotations: {}
  labels: {}
  # -- Gateways to attach to (required when enabled).
  parentRefs: []
  #  - name: my-gateway
  #    namespace: gateway-system
  #    sectionName: https
  hostnames: []
  #  - ddns.example.local
  matches:
    - path:
        type: PathPrefix
        value: /

networkPolicy:
  # -- Restrict traffic: egress only to DNS (53) and HTTPS (443); ingress only
  # from the peers below.
  enabled: false
  # -- Peers allowed to reach the status page and metrics, e.g. your ingress
  # controller, gateway or Prometheus.
  ingressFrom: []
  #  - namespaceSelector:
  #      matchLabels:
  #        kubernetes.io/metadata.name: ingress-nginx
  # -- Extra egress rules (e.g. for http:// IP sources on port 80).
  extraEgress: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

# Uses /healthz rather than /readyz so the status page stays reachable while
# updates are failing.
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 10
  timeoutSeconds: 5

priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
revisionHistoryLimit: 3
