{{- if and .Values.hostnames (eq (include "ddns-updater.credentialsSource" .) "chart") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ddns-updater.fullname" . }}
  labels:
    {{- include "ddns-updater.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.credentials.usernameKey }}: {{ .Values.credentials.username | b64enc | quote }}
  {{ .Values.credentials.passwordKey }}: {{ .Values.credentials.password | b64enc | quote }}
{{- end }}
{{- range .Values.accounts }}
{{- if and .username .password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ddns-updater.accountSecretName" (dict "root" $ "account" .) }}
  labels:
    {{- include "ddns-updater.labels" $ | nindent 4 }}
type: Opaque
data:
  {{ .usernameKey | default "username" }}: {{ .username | b64enc | quote }}
  {{ .passwordKey | default "password" }}: {{ .password | b64enc | quote }}
{{- end }}
{{- end }}
