{{- if and .Values.hostnames (eq (include "ddns-updater.credentialsSource" .) "external") }}
---
{{ include "ddns-updater.externalSecretResource" (dict
    "root" $
    "name" (include "ddns-updater.secretName" .)
    "store" .Values.externalSecret.secretStoreRef
    "refreshInterval" .Values.externalSecret.refreshInterval
    "annotations" .Values.externalSecret.annotations
    "username" .Values.externalSecret.username
    "password" .Values.externalSecret.password
    "usernameKey" .Values.credentials.usernameKey
    "passwordKey" .Values.credentials.passwordKey) }}
{{- end }}
{{- range .Values.accounts }}
{{- if and .externalSecret .externalSecret.enabled }}
{{- $store := $.Values.externalSecret.secretStoreRef }}
{{- if and .externalSecret.secretStoreRef .externalSecret.secretStoreRef.name }}
{{- $store = .externalSecret.secretStoreRef }}
{{- end }}
---
{{ include "ddns-updater.externalSecretResource" (dict
    "root" $
    "name" (include "ddns-updater.accountSecretName" (dict "root" $ "account" .))
    "store" $store
    "refreshInterval" (.externalSecret.refreshInterval | default $.Values.externalSecret.refreshInterval)
    "annotations" (.externalSecret.annotations | default $.Values.externalSecret.annotations)
    "username" .externalSecret.username
    "password" .externalSecret.password
    "usernameKey" (.usernameKey | default "username")
    "passwordKey" (.passwordKey | default "password")) }}
{{- end }}
{{- end }}
