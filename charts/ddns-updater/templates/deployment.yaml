{{- include "ddns-updater.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ddns-updater.fullname" . }}
  labels:
    {{- include "ddns-updater.labels" . | nindent 4 }}
spec:
  # Always exactly one replica: concurrent updaters would race each other.
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "ddns-updater.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- /* Restart the pod when chart-managed credentials change. */}}
      {{- $secrets := include (print $.Template.BasePath "/secret.yaml") . | trim }}
      {{- $externalSecrets := include (print $.Template.BasePath "/externalsecret.yaml") . | trim }}
      {{- if or .Values.podAnnotations $secrets $externalSecrets }}
      annotations:
        {{- with $secrets }}
        checksum/secret: {{ . | sha256sum }}
        {{- end }}
        {{- with $externalSecrets }}
        checksum/externalsecret: {{ . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "ddns-updater.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "ddns-updater.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ddns-updater
          image: {{ include "ddns-updater.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- if .Values.hostnames }}
            - name: DDNS_PROVIDER
              value: {{ .Values.provider | quote }}
            - name: DDNS_HOSTNAMES
              value: {{ join "," .Values.hostnames | quote }}
            - name: DDNS_USERNAME_FILE
              value: /run/secrets/ddns/username
            - name: DDNS_PASSWORD_FILE
              value: /run/secrets/ddns/password
            {{- end }}
            {{- with .Values.accounts }}
            {{- $names := list }}
            {{- range . }}{{ $names = append $names .name }}{{ end }}
            - name: DDNS_ACCOUNTS
              value: {{ join "," $names | quote }}
            {{- end }}
            {{- range .Values.accounts }}
            {{- $prefix := include "ddns-updater.accountEnvPrefix" . }}
            - name: {{ $prefix }}PROVIDER
              value: {{ .provider | default "mijnhost" | quote }}
            - name: {{ $prefix }}HOSTNAMES
              value: {{ join "," .hostnames | quote }}
            - name: {{ $prefix }}USERNAME_FILE
              value: /run/secrets/ddns-accounts/{{ .name }}/username
            - name: {{ $prefix }}PASSWORD_FILE
              value: /run/secrets/ddns-accounts/{{ .name }}/password
            {{- end }}
            - name: DDNS_IPV4_ENABLED
              value: {{ .Values.ipv4.enabled | quote }}
            {{- with .Values.ipv4.sources }}
            - name: DDNS_IPV4_SOURCES
              value: {{ join "," . | quote }}
            {{- end }}
            - name: DDNS_IPV6_ENABLED
              value: {{ .Values.ipv6.enabled | quote }}
            {{- with .Values.ipv6.sources }}
            - name: DDNS_IPV6_SOURCES
              value: {{ join "," . | quote }}
            {{- end }}
            - name: DDNS_INTERVAL
              value: {{ .Values.interval | quote }}
            - name: DDNS_TIMEOUT
              value: {{ .Values.timeout | quote }}
            - name: DDNS_DNS_RECHECK_INTERVAL
              value: {{ .Values.dnsRecheckInterval | quote }}
            {{- with .Values.dnsServer }}
            - name: DDNS_DNS_SERVER
              value: {{ . | quote }}
            {{- end }}
            - name: DDNS_DRY_RUN
              value: {{ .Values.dryRun | quote }}
            {{- with .Values.contactEmail }}
            - name: DDNS_CONTACT_EMAIL
              value: {{ . | quote }}
            {{- end }}
            - name: DDNS_HEARTBEAT_INTERVAL
              value: {{ .Values.heartbeatInterval | quote }}
            - name: DDNS_LISTEN_ADDR
              value: {{ printf ":%d" (int .Values.containerPort) | quote }}
            - name: DDNS_STATUS_PAGE
              value: {{ .Values.statusPage.enabled | quote }}
            - name: DDNS_METRICS
              value: {{ .Values.metrics.enabled | quote }}
            - name: DDNS_LOG_LEVEL
              value: {{ .Values.log.level | quote }}
            - name: DDNS_LOG_FORMAT
              value: {{ .Values.log.format | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.hostnames }}
            - name: credentials
              mountPath: /run/secrets/ddns
              readOnly: true
            {{- end }}
            {{- range .Values.accounts }}
            - name: credentials-{{ .name }}
              mountPath: /run/secrets/ddns-accounts/{{ .name }}
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.hostnames }}
        - name: credentials
          secret:
            secretName: {{ include "ddns-updater.secretName" . }}
            defaultMode: 0440
            items:
              - key: {{ .Values.credentials.usernameKey }}
                path: username
              - key: {{ .Values.credentials.passwordKey }}
                path: password
        {{- end }}
        {{- range .Values.accounts }}
        - name: credentials-{{ .name }}
          secret:
            secretName: {{ include "ddns-updater.accountSecretName" (dict "root" $ "account" .) }}
            defaultMode: 0440
            items:
              - key: {{ .usernameKey | default "username" }}
                path: username
              - key: {{ .passwordKey | default "password" }}
                path: password
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
